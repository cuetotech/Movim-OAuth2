Listen 127.0.0.1:8088

<VirtualHost 127.0.0.1:8088>
    ServerName movim.example.com

    DocumentRoot /var/www/movim/public

    RequestHeader unset X-Remote-User
    RequestHeader set X-Forwarded-Proto "https"

    <Directory /var/www/movim/public>
        DirectoryIndex index.php
        Options +FollowSymLinks -Indexes
        AllowOverride FileInfo Options
        Require all granted

        RewriteEngine On
        RewriteCond %{REQUEST_FILENAME} !-s
        RewriteCond %{REQUEST_FILENAME} !-h
        RewriteCond %{REQUEST_FILENAME} !-d
        RewriteRule ^(.*)$ index.php?/$1 [L,QSA]
    </Directory>

    # If nginx authenticated the user, pass X-Remote-User from nginx and list
    # 127.0.0.1 in OAUTH_TRUSTED_PROXY_IPS.

    ErrorLog ${APACHE_LOG_DIR}/movim-backend-error.log
    CustomLog ${APACHE_LOG_DIR}/movim-backend-access.log combined
</VirtualHost>
