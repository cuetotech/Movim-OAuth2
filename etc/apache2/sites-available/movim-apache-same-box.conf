<VirtualHost *:80>
    ServerName movim.example.com
    Redirect permanent / https://movim.example.com/
</VirtualHost>

<VirtualHost *:80>
    ServerName token.example.com
    ServerAlias token.example.com
    Redirect permanent / https://token.example.com/
</VirtualHost>

<VirtualHost *:443>
    ServerName movim.example.com

    SSLEngine on
    SSLCertificateFile /etc/letsencrypt/live/movim.example.com/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/movim.example.com/privkey.pem

    DocumentRoot /var/www/movim/public

    RequestHeader unset X-Remote-User
    RequestHeader set X-Forwarded-Proto "https"

    <Directory /var/www/movim/public>
        DirectoryIndex index.php
        Options +FollowSymLinks -Indexes
        AllowOverride FileInfo Options
        Require all granted

        RewriteEngine On
        RewriteCond %{REQUEST_FILENAME} !-s
        RewriteCond %{REQUEST_FILENAME} !-h
        RewriteCond %{REQUEST_FILENAME} !-d
        RewriteRule ^(.*)$ index.php?/$1 [L,QSA]
    </Directory>

    # Uncomment and adapt when Apache performs enterprise auth for Movim.
    # <Location />
    #     AuthType GSSAPI
    #     AuthName "Movim"
    #     GssapiSSLonly On
    #     Require valid-user
    #     RequestHeader set X-Remote-User "%{REMOTE_USER}s"
    # </Location>
    # Keep browser bootstrap endpoints public. Browsers may request these
    # before the interactive auth flow has completed.
    <LocationMatch "^/(manifest/?$|sw\.js$|theme/|scripts/|stickers/)">
        AuthType None
        Require all granted
    </LocationMatch>

    ProxyPass        /ws/ ws://127.0.0.1:8080/
    ProxyPassReverse /ws/ ws://127.0.0.1:8080/

    ErrorLog ${APACHE_LOG_DIR}/movim-error.log
    CustomLog ${APACHE_LOG_DIR}/movim-access.log combined
</VirtualHost>

<VirtualHost *:443>
    ServerName token.example.com

    SSLEngine on
    SSLCertificateFile /etc/letsencrypt/live/token.example.com/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/token.example.com/privkey.pem

    # PHP token service. Use this when the included PHP endpoint is installed.
    DocumentRoot /var/www/ejabberd-token-service/public

    <Directory /var/www/ejabberd-token-service/public>
        DirectoryIndex index.php
        Options -Indexes +FollowSymLinks
        AllowOverride None
        Require all granted
    </Directory>

    <Location /token>
        Require ip 127.0.0.1
        Require ip 10.0.0.0/8
        Require ip 172.16.0.0/12
        Require ip 192.168.0.0/16
    </Location>

    # Python token service alternative. Comment the PHP DocumentRoot block above
    # and uncomment this proxy when token_service.py runs on 127.0.0.1:8091.
    # ProxyPass        /token http://127.0.0.1:8091/token
    # ProxyPassReverse /token http://127.0.0.1:8091/token

    ErrorLog ${APACHE_LOG_DIR}/ejabberd-token-service-error.log
    CustomLog ${APACHE_LOG_DIR}/ejabberd-token-service-access.log combined
</VirtualHost>
