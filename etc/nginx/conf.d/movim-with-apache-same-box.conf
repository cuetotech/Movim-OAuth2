server {
    listen 80;
    listen [::]:80;
    server_name movim.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;

    server_name movim.example.com;

    ssl_certificate /etc/letsencrypt/live/movim.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/movim.example.com/privkey.pem;

    # Same-box sample: nginx owns public TLS and Apache serves Movim on 127.0.0.1:8088.
    location / {
        proxy_pass http://127.0.0.1:8088;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Remote-User $remote_user;
        proxy_read_timeout 1800s;
        proxy_send_timeout 1800s;
    }

    # Keep websocket traffic pointed directly at the Movim daemon.
    location /ws/ {
        proxy_pass http://127.0.0.1:8080/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 1800s;
        proxy_send_timeout 1800s;
        proxy_redirect off;
    }
}
